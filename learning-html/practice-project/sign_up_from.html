<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From</title>
</head>
<body>
    <h1 style="text-align: center;">Sign Up Form</h1>
    <hr>
    <br>

    <label for="user">Name:</label>
    <input type="text" id="user" name="user" placeholder="User Name"> 
    <br>

    <label for="email">Email:</label>
    <input type="text" id="email" name="usermail"  placeholder="Enter your email" required>
    <br>

    <label for="pass">Password:</label>
    <input type="password" id="pass" name="password" placeholder="Password">
    <br>

    <label for="num">Number:</label>
    <br>
    <select name="code">    <label for="gnd"

        <option value="+880">+880</option>
        <option value="+990">+990</option>
        <option value="+110">+110</option>
    </select>
    <input type="number" id="num" name="number" placeholder="123456789" required>
    <br>

    <label for="contry">Country</label>
    <input list="contry">
    <datalist id="contry">
        <option value="Bangladesh"></option>
        <option value="India"></option>
        <option value="Canada"></option>
        <option value="China"></option>
        <option value="Pakistan"></option>
        <option value="USA"></option>

    </datalist>
    <br>

    Gender:
    <label for="gnd1">Male</label>
    <input type="radio" id="gnd1" name="gender">

    <label for="gnd2">Female</label>
    <input type="radio" id="gnd2" name="gender">
    <br>

    <label for="date">Date Of Birth:</label>
    <input type="date" id="date" name="dob">
    <br>

    <label for="time">Time:</label>
    <input type="time" id="time" name="time">
    <br>

    <label for="color">Color:</label>
    <input type="color" id="color" name="color">
    <br>

    <label for="file"> Choose Photo:</label>
    <input type="file" id="file" name="file">
    <br>

    <label for="vehicle1">I have a Bike</label>
    <input type="checkbox" id="vehicle1" name="checkbox">
    <label for="vehicle2">I have a Car</label>
    <input type="checkbox" id="vehicle2" name="checkbox">
    <br>

    <textarea name="comment" cols="30" rows="10" >Comment Here </textarea>
    <br>

    <input type="submit" value="Send">
    <input type="reset"  value="Reset">
    
    
</body>
</html>
